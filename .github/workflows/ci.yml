name: ResearchVault Local Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, User Workflow, API & Production Mode Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript typecheck
        run: pnpm typecheck

      - name: Run automated 6-step user workflow verification
        run: pnpm test:workflow

      - name: Run public adapter config & HTTP boundary tests
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Verify production runtime mode separation (local-simulation vs live)
        run: pnpm smoke:production-mode
