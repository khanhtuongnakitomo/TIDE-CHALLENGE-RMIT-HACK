name: researchvault-tide

services:
  tidecloak:
    image: tideorg/tidecloak-dev:0.14.41
    container_name: researchvault-tidecloak
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set it in data/tidecloak-docker.env}"
    volumes:
      - tidecloak-data:/opt/keycloak/data/h2

volumes:
  tidecloak-data:
    name: researchvault-tide-data
